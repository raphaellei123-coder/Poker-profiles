<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>Add / Edit Player — Poker Profiles</title>
  <link rel="stylesheet" href="css/style.css">
</head>
<body>
  <header class="site-header">
    <h1 id="form-title">Add Player</h1>
    <a class="link-small" href="players.html">Back to players</a>
  </header>
  <main class="container">
    <form id="player-form">
      <label>
        Name
        <input type="text" name="name" id="name" required>
      </label>
      <label>
        Age
        <input type="number" name="age" id="age" min="0">
      </label>
      <label>
        Bio
        <textarea name="bio" id="bio" rows="4"></textarea>
      </label>
      <div class="form-actions">
        <button type="submit" class="btn">Save</button>
        <button type="button" id="cancel" class="btn btn-muted">Cancel</button>
      </div>
    </form>
  </main>
  <script src="js/app.js"></script>
</body>
</html>
